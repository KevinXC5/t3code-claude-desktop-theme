<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" width="1120" height="650" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="55%" stop-color="#1A1817"/>
      <stop offset="100%" stop-color="#221B18"/>
    </linearGradient>
    <linearGradient id="laserLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="laserMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="laserHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="50%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="laserXhigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </linearGradient>
    <linearGradient id="laserMax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1BEE7"/>
      <stop offset="50%" stop-color="#82B1FF"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </linearGradient>
    <linearGradient id="laserHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="25%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#A7FFEB"/>
      <stop offset="75%" stop-color="#82B1FF"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowHigh" x="-25%" y="-35%" width="150%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F96B7E" flood-opacity="0.4"/>
    </filter>
    <filter id="glowHolo" x="-25%" y="-35%" width="150%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#CE93D8" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1120" height="650" rx="22" fill="url(#bgGrad)"/>

  <!-- Top Header -->
  <g transform="translate(44, 34)">
    <text x="0" y="24" fill="#F2ECE6" font-size="24" font-weight="700" letter-spacing="-0.4">Claude Desktop Theme for T3 Code</text>
    <text x="0" y="50" fill="#9E9790" font-size="13.5">Warm Charcoal &amp; Parchment Surfaces · Anthropic Serif Prose · Unified Terracotta Accent · 6-Tier Flowing Laser Effort</text>

    <!-- Swatch Pills on Top Right -->
    <g transform="translate(765, 6)">
      <rect x="0" y="0" width="122" height="32" rx="16" fill="#262422" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="18" cy="16" r="6" fill="#191919" stroke="rgba(255,255,255,0.28)"/>
      <circle cx="34" cy="16" r="6" fill="#D97757"/>
      <circle cx="50" cy="16" r="6" fill="#C23B3B"/>
      <text x="64" y="20" fill="#DDD6CF" font-size="11.5" font-weight="600">Dark Mode</text>

      <rect x="134" y="0" width="132" height="32" rx="16" fill="#FAF9F5" stroke="#DEDAD0"/>
      <circle cx="152" cy="16" r="6" fill="#FAF9F5" stroke="#C7C2B6"/>
      <circle cx="168" cy="16" r="6" fill="#C96442"/>
      <circle cx="184" cy="16" r="6" fill="#A62626"/>
      <text x="198" y="20" fill="#2C2C2A" font-size="11.5" font-weight="600">Light Mode</text>
    </g>
  </g>

  <!-- LEFT: Dark Mode App Window Mockup -->
  <g transform="translate(44, 108)" filter="url(#cardShadow)">
    <rect width="586" height="494" rx="16" fill="#191919" stroke="#2E2E2E" stroke-width="1.2"/>

    <!-- Sidebar -->
    <path d="M 16 0 H 168 V 494 H 16 A 16 16 0 0 1 0 478 V 16 A 16 16 0 0 1 16 0 Z" fill="#1F1F1F"/>
    <line x1="168" y1="0" x2="168" y2="494" stroke="#2E2E2E" stroke-width="1"/>

    <!-- Window Dots + T3 [Code] Pill -->
    <circle cx="20" cy="20" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="20" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="20" r="5" fill="#27C93F"/>
    <text x="74" y="24" fill="#EBEBEB" font-size="13.5" font-weight="700">T3</text>
    <rect x="96" y="10" width="44" height="19" rx="9.5" fill="rgba(217,119,87,0.18)"/>
    <text x="104" y="23" fill="#D97757" font-size="11" font-weight="600">Code</text>

    <!-- Search + New Thread Button -->
    <rect x="12" y="42" width="110" height="28" rx="8" fill="#262626" stroke="rgba(217,119,87,0.45)" stroke-width="1"/>
    <circle cx="25" cy="56" r="4.5" fill="none" stroke="#8E8E8E" stroke-width="1.4"/>
    <line x1="28.5" y1="59.5" x2="31.5" y2="62.5" stroke="#8E8E8E" stroke-width="1.4" stroke-linecap="round"/>
    <text x="37" y="60" fill="#7A7A7A" font-size="11">Search</text>

    <rect x="128" y="41" width="28" height="28" rx="8" fill="rgba(217,119,87,0.16)" stroke="rgba(217,119,87,0.28)"/>
    <line x1="142" y1="49" x2="142" y2="61" stroke="#D97757" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="136" y1="55" x2="148" y2="55" stroke="#D97757" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Sidebar Thread Rows (Crimson Pin + Full Color Provider Badges) -->
    <g transform="translate(12, 84)">
      <rect width="144" height="44" rx="9" fill="#343434"/>
      <rect x="8" y="8" width="16" height="16" rx="4" fill="rgba(217,119,87,0.25)"/>
      <text x="11.5" y="19.5" fill="#E8937A" font-size="8.5" font-weight="700">UI</text>
      <!-- Crimson Pin -->
      <path d="M31 11h5l-1 4 1.5 1.5v1H34v3l-.5.5-.5-.5v-3h-2.5v-1L32 15z" fill="#C23B3B"/>
      <text x="41" y="19" fill="#EBEBEB" font-size="11" font-weight="600">Design System</text>
      <text x="10" y="35" fill="#999999" font-size="10">Claude theme polish</text>
      <circle cx="132" cy="31" r="4.5" fill="#D97757"/>
    </g>

    <g transform="translate(12, 136)">
      <rect width="144" height="42" rx="9" fill="transparent"/>
      <rect x="8" y="8" width="16" height="16" rx="4" fill="rgba(79,182,154,0.22)"/>
      <text x="11.5" y="19.5" fill="#4FB69A" font-size="8.5" font-weight="700">RS</text>
      <text x="30" y="19" fill="#D4D4D4" font-size="11">API Gateway</text>
      <text x="10" y="34" fill="#888888" font-size="10">Rate limiter refactor</text>
      <circle cx="132" cy="30" r="4.5" fill="#69A6F8"/>
    </g>

    <g transform="translate(12, 184)">
      <rect width="144" height="42" rx="9" fill="transparent"/>
      <rect x="8" y="8" width="16" height="16" rx="4" fill="rgba(198,141,253,0.22)"/>
      <text x="11" y="19.5" fill="#C68DFD" font-size="8.5" font-weight="700">TS</text>
      <text x="30" y="19" fill="#D4D4D4" font-size="11">Web Worker</text>
      <text x="10" y="34" fill="#888888" font-size="10">Streaming parser</text>
      <circle cx="132" cy="30" r="4.5" fill="#C68DFD"/>
    </g>

    <!-- Annotations on Left Sidebar -->
    <g transform="translate(14, 248)">
      <rect width="140" height="226" rx="10" fill="#22201F" stroke="#302C2A"/>
      <text x="12" y="24" fill="#E8937A" font-size="10.5" font-weight="700">SIDEBAR DETAILS</text>
      <circle cx="16" cy="46" r="3.5" fill="#C23B3B"/>
      <text x="26" y="49.5" fill="#CCCCCC" font-size="10.5">Crimson Pin (#C23B3B)</text>
      <circle cx="16" cy="70" r="3.5" fill="#D97757"/>
      <text x="26" y="73.5" fill="#CCCCCC" font-size="10.5">Terracotta Search Glow</text>
      <circle cx="16" cy="94" r="3.5" fill="#4FB69A"/>
      <text x="26" y="97.5" fill="#CCCCCC" font-size="10.5">Zero-Grayscale Badges</text>
      <circle cx="16" cy="118" r="3.5" fill="#E8937A"/>
      <text x="26" y="121.5" fill="#CCCCCC" font-size="10.5">Unified Diff &amp; Tree Accent</text>
      <circle cx="16" cy="142" r="3.5" fill="#999999"/>
      <text x="26" y="145.5" fill="#CCCCCC" font-size="10.5">No Combobox Inner Box</text>
      <line x1="12" y1="162" x2="128" y2="162" stroke="#322F2D"/>
      <text x="12" y="182" fill="#999999" font-size="10">Fonts:</text>
      <text x="12" y="198" fill="#DED7D0" font-size="10" font-family="Charter, Georgia, serif">Anthropic Serif (Prose)</text>
      <text x="12" y="213" fill="#999999" font-size="9.5" font-family="ui-monospace, Menlo, monospace">Anthropic Mono (Code)</text>
    </g>

    <!-- Main Chat Area -->
    <!-- Top Chat Header -->
    <line x1="168" y1="42" x2="586" y2="42" stroke="#2E2E2E" stroke-width="1"/>
    <text x="188" y="26" fill="#EBEBEB" font-size="12.5" font-weight="600">Claude Desktop Theme Showcase</text>

    <!-- User Bubble -->
    <g transform="translate(272, 60)">
      <rect width="292" height="40" rx="14" fill="#262424" stroke="rgba(255,255,255,0.085)"/>
      <text x="14" y="24.5" fill="#EBEBEB" font-size="12">Refine the typography and 6-tier effort bar.</text>
    </g>

    <!-- Assistant Serif Message -->
    <g transform="translate(188, 118)">
      <text x="0" y="14" fill="#EBEBEB" font-size="13.5" font-family="Charter, Georgia, serif">Assistant replies switch to an editorial <tspan fill="#E8937A" text-decoration="underline">Anthropic Serif</tspan> stack</text>
      <text x="0" y="36" fill="#EBEBEB" font-size="13.5" font-family="Charter, Georgia, serif">while tool logs stay clean sans-serif and code uses Mono.</text>

      <!-- Blockquote -->
      <path d="M 0 54 H 376 A 8 8 0 0 1 384 62 V 92 A 8 8 0 0 1 376 100 H 0 Z" fill="rgba(217,119,87,0.14)"/>
      <rect x="0" y="54" width="3" height="46" fill="#D97757"/>
      <text x="14" y="75" fill="#C7BEB7" font-size="12" font-family="Charter, Georgia, serif">Callouts, links, text selection, diffs, and file trees all</text>
      <text x="14" y="92" fill="#C7BEB7" font-size="12" font-family="Charter, Georgia, serif">harmonize around Claude’s warm terracotta palette.</text>

      <!-- Code Block -->
      <rect x="0" y="114" width="384" height="58" rx="10" fill="#141414" stroke="rgba(255,255,255,0.085)"/>
      <text x="14" y="136" fill="#8E8E8E" font-size="10.5" font-family="ui-monospace, Menlo, monospace">theme.css</text>
      <text x="14" y="156" fill="#E8937A" font-size="11" font-family="ui-monospace, Menlo, monospace">background-clip: padding-box, border-box;</text>
    </g>

    <!-- Floating Composer Card -->
    <g transform="translate(186, 368)">
      <rect width="382" height="104" rx="16" fill="#303030" stroke="rgba(217,119,87,0.46)" stroke-width="1.2"/>
      <text x="16" y="28" fill="#7A7A7A" font-size="12.5">Ask anything. @ files, $ skills, / commands</text>

      <!-- Bottom Row: Model | Crimson High Pill + Squircle Send -->
      <g transform="translate(14, 66)">
        <!-- Model Icon -->
        <circle cx="10" cy="13" r="6.5" fill="none" stroke="#B5B0AA" stroke-width="1.4"/>
        <circle cx="10" cy="13" r="2.2" fill="#B5B0AA"/>
        <text x="23" y="17" fill="#E2DDD8" font-size="12" font-weight="500">GPT-6.1 Terra</text>
        <line x1="112" y1="6" x2="112" y2="20" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>

        <!-- Crimson High Laser Pill (16px icon + laser rim) -->
        <g transform="translate(121, 1)" filter="url(#glowHigh)">
          <rect x="0" y="0" width="70" height="24" rx="7.5" fill="#252428" stroke="url(#laserHigh)" stroke-width="1.2"/>
          <path d="M12.5 14.5A2 2 0 0 0 14.2 12.5c0-1-.4-1.5-.8-2.2-.8-1.5-.2-2.9 1.4-4.3.4 1.8 1.5 3.5 3 4.7 1.4 1.2 2.2 2.5 2.2 4a5 5 0 1 1-10 0c0-.8.3-1.6.7-2.2a2 2 0 0 0 1.8 2z" fill="none" stroke="#F96B7E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="27" y="16" fill="#F96B7E" font-size="11.5" font-weight="600">High</text>
        </g>

        <!-- Ultra Laser Pill preview beside it? No, show squircle send button cleanly on right -->
        <rect x="326" y="-2" width="28" height="28" rx="10" fill="#D97757"/>
        <path d="M340 17V7M335.5 11.5 340 7l4.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- RIGHT: Light Mode Card + Redesigned Horizontal Model Picker -->
  <g transform="translate(652, 108)">
    <!-- Light Mode Mini Showcase Card -->
    <g filter="url(#cardShadow)">
      <rect width="424" height="196" rx="16" fill="#FAF9F5" stroke="#E6E3DA" stroke-width="1.2"/>
      <rect x="0" y="0" width="108" height="196" rx="16" fill="#F4F2EA"/>
      <rect x="92" y="0" width="16" height="196" fill="#F4F2EA"/>
      <line x1="108" y1="0" x2="108" y2="196" stroke="#E7E4DA"/>

      <text x="14" y="26" fill="#141413" font-size="12" font-weight="700">T3</text>
      <rect x="33" y="14" width="38" height="16" rx="8" fill="rgba(201,100,66,0.14)"/>
      <text x="39" y="25.5" fill="#C96442" font-size="9.5" font-weight="600">Code</text>
      <rect x="12" y="42" width="84" height="26" rx="7" fill="#E5E2D7"/>
      <path d="M22 49h4l-.8 3.2 1.2 1.2v.8h-2v2.4l-.4.4-.4-.4v-2.4h-2v-.8l1.2-1.2z" fill="#A62626"/>
      <text x="31" y="58.5" fill="#141413" font-size="10" font-weight="600">Light UI</text>
      <text x="16" y="88" fill="#6B6A64" font-size="10">Warm Linen</text>
      <text x="16" y="106" fill="#6B6A64" font-size="10">#FAF9F5</text>
      <text x="16" y="128" fill="#C96442" font-size="10" font-weight="600">#C96442</text>

      <!-- Light Content + Composer -->
      <text x="126" y="34" fill="#141413" font-size="13" font-family="Charter, Georgia, serif">Warm parchment canvas with crisp ink contrast.</text>
      <rect x="126" y="48" width="276" height="32" rx="8" fill="#F0EEE6" stroke="#E6E3DA"/>
      <text x="138" y="68" fill="#3D3D3A" font-size="10.5" font-family="ui-monospace, Menlo, monospace">--cd-bg: #FAF9F5; --cd-accent: #C96442;</text>

      <!-- Light Composer with Holographic Ultra Trigger -->
      <rect x="126" y="96" width="278" height="80" rx="14" fill="#FFFFFF" stroke="rgba(201,100,66,0.44)" stroke-width="1.2"/>
      <text x="140" y="120" fill="#9C9A92" font-size="11.5">Ask anything in Light appearance...</text>
      <g transform="translate(138, 140)">
        <text x="0" y="16" fill="#141413" font-size="11" font-weight="500">4 Hydrogen</text>
        <line x1="68" y1="6" x2="68" y2="19" stroke="rgba(20,20,19,0.16)"/>
        <rect x="76" y="1" width="66" height="22" rx="7" fill="#FCFBF8" stroke="url(#laserHolo)" stroke-width="1.2"/>
        <path d="M90 5 84 13h4l-.7 5.5 6-8h-4l.7-5.5z" fill="url(#laserHolo)"/>
        <text x="99" y="15.5" fill="#2D2638" font-size="11" font-weight="700">Extra</text>
        <rect x="234" y="-1" width="24" height="24" rx="8.5" fill="#C96442"/>
        <path d="M246 15V7M242.5 10.5 246 7l3.5 3.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Bottom Right: Redesigned Horizontal Model Picker Popover -->
    <g transform="translate(0, 214)" filter="url(#cardShadow)">
      <rect width="424" height="280" rx="16" fill="#202020" stroke="rgba(255,255,255,0.11)" stroke-width="1.2"/>
      <!-- Search Models Header -->
      <text x="16" y="28" fill="#E8937A" font-size="10.5" font-weight="700">HORIZONTAL MODEL PICKER (632px)</text>
      <line x1="0" y1="40" x2="424" y2="40" stroke="rgba(255,255,255,0.08)"/>

      <!-- Compact Model List -->
      <rect x="0" y="41" width="42" height="104" fill="#1C1C1C"/>
      <text x="15" y="66" fill="#D97757" font-size="12">★</text>
      <circle cx="21" cy="90" r="6" fill="none" stroke="#8E8E8E" stroke-width="1.3"/>
      <circle cx="21" cy="116" r="6" fill="none" stroke="#69A6F8" stroke-width="1.3"/>

      <g transform="translate(54, 52)">
        <rect x="0" y="0" width="356" height="26" rx="7" fill="transparent"/>
        <text x="10" y="17" fill="#BDBDBD" font-size="11.5">GPT-6.1-Sol</text>
        <text x="328" y="17" fill="#7A7A7A" font-size="10.5">⌘1</text>

        <rect x="0" y="29" width="356" height="26" rx="7" fill="rgba(217,119,87,0.14)"/>
        <text x="10" y="46" fill="#FFFFFF" font-size="11.5" font-weight="600">GPT-6.1 Terra  ✓</text>
        <text x="328" y="46" fill="#E8937A" font-size="10.5">⌘3</text>

        <rect x="0" y="58" width="356" height="26" rx="7" fill="transparent"/>
        <text x="10" y="75" fill="#BDBDBD" font-size="11.5">Gemini 4 Hydrogen</text>
        <text x="328" y="75" fill="#7A7A7A" font-size="10.5">⌘8</text>
      </g>

      <!-- Effort Panel at Bottom -->
      <line x1="0" y1="145" x2="424" y2="145" stroke="rgba(255,255,255,0.09)"/>
      <rect x="1" y="146" width="422" height="133" rx="15" fill="rgba(0,0,0,0.20)"/>
      <text x="14" y="166" fill="#CCCCCC" font-size="11" font-weight="600">Reasoning</text>
      <text x="358" y="166" fill="#8E8E8E" font-size="10.5">6.1 Terra</text>

      <!-- 6-Tier Segmented Track (No Clipping, Only Active Lit) -->
      <rect x="12" y="176" width="400" height="42" rx="10" fill="rgba(0,0,0,0.34)"/>
      <g transform="translate(18, 180)" font-size="10.5" font-weight="500">
        <!-- Low (unchecked) -->
        <circle cx="8" cy="17.5" r="3.2" fill="#4FB69A"/>
        <text x="16" y="21" fill="#999999">Low</text>

        <!-- Medium (unchecked) -->
        <circle cx="49" cy="17.5" r="3.2" fill="#69A6F8"/>
        <text x="57" y="21" fill="#999999">Medium</text>

        <!-- High (unchecked) -->
        <circle cx="110" cy="17.5" r="3.2" fill="#F96B7E"/>
        <text x="118" y="21" fill="#999999">High</text>

        <!-- Extra High (unchecked) -->
        <circle cx="154" cy="17.5" r="3.2" fill="#F2B84B"/>
        <text x="162" y="21" fill="#999999">Extra High</text>

        <!-- Max (unchecked) -->
        <circle cx="228" cy="17.5" r="3.2" fill="#C68DFD"/>
        <text x="236" y="21" fill="#999999">Max</text>

        <!-- Ultra TURBO (ACTIVE CHECKED with Holo Laser Rim!) -->
        <g transform="translate(272, 1)" filter="url(#glowHolo)">
          <rect x="0" y="0" width="114" height="32" rx="7.5" fill="#252428" stroke="url(#laserHolo)" stroke-width="1.2"/>
          <path d="M15 8 9.5 16h4l-.7 6.5 6-8.5h-4l.7-6z" fill="url(#laserHolo)"/>
          <text x="25" y="20" fill="#F2ECFA" font-size="10.5" font-weight="700">Ultra</text>
          <rect x="59" y="8" width="44" height="16" rx="4" fill="url(#laserHolo)"/>
          <text x="64" y="19" fill="#1A181D" font-size="8.5" font-weight="800" font-style="italic">TURBO</text>
        </g>
      </g>

      <!-- Extra Row below (Cyber Access) -->
      <line x1="14" y1="230" x2="410" y2="230" stroke="rgba(255,255,255,0.06)"/>
      <text x="14" y="248" fill="#8E8E8E" font-size="10">Cyber Access</text>
      <text x="14" y="264" fill="#E2E2E2" font-size="11.5" font-weight="500">Standard</text>
      <text x="398" y="262" fill="#8E8E8E" font-size="12">&gt;</text>
    </g>
  </g>
</svg>
