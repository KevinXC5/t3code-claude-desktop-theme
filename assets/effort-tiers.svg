  <text x="36" y="68" fill="#9E9790" font-size="12.5">Synced across the bottom composer pill (14px optically centered glyph) and active [aria-checked="true"] picker pills (15px)</text>

  <!-- Tier Cards (3x2 Grid) -->
  <!-- Card 1: Low -->
  <g transform="translate(36, 92)">
    <rect width="336" height="122" rx="14" fill="#222120" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="28" fill="#8E8E8E" font-size="10.5" font-weight="700">TIER 1 · LOW / MINIMAL</text>
    <rect x="18" y="42" width="118" height="32" rx="8.5" fill="#252428" stroke="url(#lLow)" stroke-width="1.3"/>
    <path d="M37 64a1.8 1.8 0 0 0 1.3-.5l5.4-5.4a5.2 5.2 0 0 0-7.4-7.4l-5.4 5.4a1.8 1.8 0 0 0-.5 1.3v5.8a.9.9 0 0 0 .9.9zm3-9.5-12 12M41 61h-7.5" fill="none" stroke="#4FB69A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="62.5" fill="#4FB69A" font-size="13" font-weight="600">Low</text>
