<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 492" width="1120" height="492" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', system-ui, sans-serif">
