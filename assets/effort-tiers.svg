    <path d="M38 49 30 59h5l-.8 7 8-10h-5l.8-7z" fill="#F2B84B"/>
    <text x="52" y="62.5" fill="#F2B84B" font-size="13" font-weight="600">Extra High</text>
    <rect x="168" y="42" width="106" height="32" rx="8.5" fill="#FCFBF8" stroke="url(#lXhigh)" stroke-width="1.3"/>
    <circle cx="184" cy="58" r="5" fill="#C4820C"/>
    <text x="196" y="62.5" fill="#C4820C" font-size="12.5" font-weight="600">Light</text>
    <text x="18" y="102" fill="#A6A099" font-size="11">Amber Gold (#F2B84B / #C4820C) · Bolt Glyph</text>
  </g>

  <!-- Card 5: Max -->
