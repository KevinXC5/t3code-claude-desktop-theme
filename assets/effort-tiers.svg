    <rect width="336" height="122" rx="14" fill="#222120" stroke="rgba(206,147,216,0.32)"/>
    <text x="18" y="28" fill="#E1BEE7" font-size="10.5" font-weight="700">FINAL TIER · EXTRA / ULTRA TURBO</text>
