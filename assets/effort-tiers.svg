    <path d="M34 60a2.1 2.1 0 0 0 2.1-2.1c0-1.1-.4-1.7-.8-2.5-.9-1.7-.2-3.3 1.7-4.9.4 2 1.7 4 3.3 5.3 1.6 1.3 2.5 2.8 2.5 4.5a5.8 5.8 0 1 1-11.6 0c0-1 .4-1.9.8-2.5a2.1 2.1 0 0 0 2 2.2z" fill="none" stroke="#F96B7E" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="52" y="62.5" fill="#F96B7E" font-size="13" font-weight="600">High</text>
