    <text x="102" y="61.5" fill="#1A181D" font-size="9" font-weight="800" font-style="italic">TURBO</text>
    <rect x="194" y="42" width="106" height="32" rx="8.5" fill="#FCFBF8" stroke="url(#lHolo)" stroke-width="1.4"/>
    <circle cx="210" cy="58" r="5" fill="url(#lHolo)"/>
    <text x="222" y="62.5" fill="#2D2638" font-size="12.5" font-weight="700">Light</text>
    <text x="18" y="102" fill="#A6A099" font-size="11">Full Holographic Gradient + Animated Flow + TURBO</text>
  </g>

  <!-- Bottom Architecture Footnote Box -->
  <g transform="translate(36, 374)">
    <rect width="1048" height="92" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#E8937A" font-size="12" font-weight="700">ADAPTIVE TIER RULES (4 / 5 / 6+ EFFORT LEVELS)</text>
    <text x="20" y="52" fill="#BFB9B2" font-size="11.5">• <tspan fill="#EBEBEB" font-weight="600">4-Tier Models</tspan> (e.g. Gemini 4 Hydrogen): Low → Medium → High → Extra (Holographic TURBO)</text>
    <text x="560" y="52" fill="#BFB9B2" font-size="11.5">• <tspan fill="#EBEBEB" font-weight="600">5-Tier Models</tspan> (e.g. Claude): Extra High (Gold) → Max (Crown + Holo TURBO)</text>
    <text x="20" y="75" fill="#BFB9B2" font-size="11.5">• <tspan fill="#EBEBEB" font-weight="600">6-Tier Models</tspan> (e.g. GPT-6.1 Terra): Low → Medium → High (Crimson) → Extra High (Gold) → Max (Crown) → Ultra (Holo TURBO)</text>
  </g>
