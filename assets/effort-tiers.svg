    <text x="52" y="62.5" fill="#C68DFD" font-size="13" font-weight="600">Max</text>
    <rect x="148" y="42" width="106" height="32" rx="8.5" fill="#FCFBF8" stroke="url(#lMax)" stroke-width="1.3"/>
    <circle cx="164" cy="58" r="5" fill="#8743CE"/>
    <text x="176" y="62.5" fill="#8743CE" font-size="12.5" font-weight="600">Light</text>
    <text x="18" y="102" fill="#A6A099" font-size="11">Phantom Violet (#C68DFD / #8743CE) · Crown</text>
  </g>

