    <path d="M43 49v3M41.5 50.5h3" stroke="#69A6F8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="54" y="62.5" fill="#69A6F8" font-size="13" font-weight="600">Medium</text>
    <rect x="158" y="42" width="106" height="32" rx="8.5" fill="#FCFBF8" stroke="url(#lMed)" stroke-width="1.3"/>
